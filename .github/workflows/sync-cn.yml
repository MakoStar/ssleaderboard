name: Sync

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - uses: pnpm/action-setup@v3
      with:
        version: 11

    - name: Sync
      env:
        DEVICE: ${{ secrets.DEVICE }}
        DEVICE_CN: ${{secrets.DEVICE_CN}}
        UID_CN: ${{ secrets.UID_CN }}
        TOKEN_CN: ${{ secrets.TOKEN_CN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        pnpm install
        node index_cn.js
        git add .
        if ! git diff --cached --quiet; then
          git commit -m "sync"
          git push
        else
          echo "No changes to commit"
        fi

